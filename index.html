<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Player</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0e0e12;color:#f1f1f4;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:720px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top button{flex-shrink:0;padding:13px 26px;border:0;border-radius:10px;background:#6c5ce7;color:#fff;font-family:inherit;font-size:1.15rem;font-weight:600;cursor:pointer}
.top button:disabled{opacity:.5}
.top p{margin:0;font-size:1.1rem;font-weight:500;color:#f1f1f4}
#file{display:none}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
#list video{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#000;cursor:pointer}

/* layar penuh versi potret (overlay, tidak memutar layar) */
#ov{position:fixed;inset:0;z-index:100;background:#000;display:none}
#ov.on{display:block}
#ov video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#ov .b{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:2;width:44px;height:44px;border:0;border-radius:10px;background:rgba(0,0,0,.55);color:#fff;font-size:1.4rem;line-height:1;cursor:pointer}
#close{left:10px}
#rot{right:10px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button id="btn" type="button">Upload</button>
    <p id="msg"></p>
    <input id="file" type="file" accept="video/*">
  </div>
  <div id="list"></div>
</div>

<div id="ov">
  <button id="close" class="b" type="button" aria-label="tutup">&#10005;</button>
  <button id="rot" class="b" type="button" aria-label="layar penuh landscape">&#9974;</button>
  <video id="ovv" controls playsinline></video>
</div>

<script>
const UPLOAD_URLS = ["/api/upload", "https://videy.co/api/upload"]; // proxy Netlify dulu, cadangan langsung ke videy
const LIST_API = "/.netlify/functions/list";
const ADD_API  = "/.netlify/functions/add";
const CDN      = id => "https://cdn.videy.co/" + id + ".mp4";

const list = document.getElementById("list");
const f = document.getElementById("file");
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");
const ov = document.getElementById("ov");
const ovv = document.getElementById("ovv");
const rot = document.getElementById("rot");

function openOv(src){
  list.querySelectorAll("video").forEach(o => o.pause());
  rot.style.display = "none";
  ovv.src = src;
  ov.classList.add("on");
  ovv.play().catch(() => {});
}
function closeOv(){
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  ovv.pause();
  ovv.removeAttribute("src");
  ovv.load();
  ov.classList.remove("on");
}

// tombol kotak cuma muncul kalau videonya landscape (16:9 dst)
ovv.addEventListener("loadedmetadata", () => {
  rot.style.display = ovv.videoWidth > ovv.videoHeight ? "block" : "none";
});

rot.addEventListener("click", async () => {
  try {
    if (ovv.requestFullscreen) await ovv.requestFullscreen();
    else if (ovv.webkitEnterFullscreen) ovv.webkitEnterFullscreen();
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
  } catch {}
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
});

document.getElementById("close").addEventListener("click", closeOv);
document.addEventListener("keydown", e => { if (e.key === "Escape" && ov.classList.contains("on")) closeOv(); });

// daftar video: utama di server (Netlify Blobs), cadangan localStorage
const KEY = "videoList";
function loadLocal(){
  try { const a = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(a) ? a : []; }
  catch { return []; }
}
function saveLocal(src){
  try { const a = loadLocal(); a.push(src); localStorage.setItem(KEY, JSON.stringify(a)); } catch {}
}
async function loadAll(){
  try {
    const r = await fetch(LIST_API, { cache: "no-store" });
    if (r.ok) { const a = await r.json(); if (Array.isArray(a)) return a; }
  } catch {}
  return loadLocal();
}
function saveShared(src){
  fetch(ADD_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: src }) }).catch(() => {});
}

function addVideo(src){
  const v = document.createElement("video");
  v.playsInline = true;
  v.muted = true;
  v.preload = "metadata";
  v.src = src + "#t=0.1";
  v.addEventListener("click", () => openOv(src));
  list.appendChild(v);
}

// upload: coba URL satu per satu sampai ada yang berhasil
function upload(file, urls, onProgress){
  return new Promise((resolve, reject) => {
    const [url, ...rest] = urls;
    const fd = new FormData();
    fd.append("file", file, file.name);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    xhr.setRequestHeader("Accept", "application/json");
    xhr.upload.onprogress = onProgress;
    const next = err => rest.length ? upload(file, rest, onProgress).then(resolve, reject) : reject(err);
    xhr.onload = () => {
      try { const id = JSON.parse(xhr.responseText).id; if (!id) throw 0; resolve(id); }
      catch { next("gagal ambil link (status " + xhr.status + ")"); }
    };
    xhr.onerror = () => next("upload gagal (CORS / koneksi)");
    xhr.send(fd);
  });
}

loadAll().then(a => a.forEach(addVideo));
btn.addEventListener("click", () => f.click());

f.addEventListener("change", () => {
  const file = f.files[0];
  f.value = "";
  if (!file) return;

  btn.disabled = true;
  msg.textContent = "mengupload 0%";
  upload(file, UPLOAD_URLS, e => {
    if (e.lengthComputable) msg.textContent = "mengupload " + Math.round(e.loaded / e.total * 100) + "%";
  }).then(id => {
    const url = CDN(id);
    msg.textContent = "";
    addVideo(url);
    saveLocal(url);
    saveShared(url);
  }).catch(err => {
    msg.textContent = err;
  }).finally(() => {
    btn.disabled = false;
  });
});
</script>
</body>
</html>
