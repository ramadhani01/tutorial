<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Player</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0e0e12;color:#f1f1f4;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:720px}
video{display:block;margin:0 auto;max-width:100%;height:calc(100vh - 190px);height:calc(100dvh - 190px);aspect-ratio:9/16;object-fit:contain;border-radius:12px;background:#000}
.info{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.info p{margin:0;font-size:1.2rem;line-height:1.35;font-weight:500;color:#f1f1f4}
.info button{flex-shrink:0;padding:13px 26px;border:0;border-radius:10px;background:#6c5ce7;color:#fff;font-family:inherit;font-size:1.15rem;font-weight:600;cursor:pointer}
#file{display:none}
.info p.link{cursor:pointer;word-break:break-all;font-size:1rem;color:#a29bfe}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="wrap">
  <video id="v" controls playsinline></video>
  <div class="info">
    <p id="msg">upload</p>
    <button id="btn" type="button">Upload</button>
    <input id="file" type="file" accept="video/*">
  </div>
</div>
<script>
const VIDEO_URL  = "https://cdn.videy.co/vkNgpJHF1.mp4"; // video default
const UPLOAD_API = "https://videy.co/api/upload";        // FILL: kalau kena CORS, ganti ke URL worker.js-mu
const CDN        = id => "https://cdn.videy.co/" + id + ".mp4";

const v = document.getElementById("v");
const f = document.getElementById("file");
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");
let link = null;

v.src = VIDEO_URL;
btn.addEventListener("click", () => f.click());

msg.addEventListener("click", async () => {
  if (!link) return;
  try { await navigator.clipboard.writeText(link); msg.textContent = "tersalin: " + link; }
  catch { prompt("salin link:", link); }
});

function setMsg(t, isLink){ msg.textContent = t; msg.classList.toggle("link", !!isLink); }

f.addEventListener("change", () => {
  const file = f.files[0];
  f.value = "";
  if (!file) return;

  link = null;
  v.pause();

  const fd = new FormData();
  fd.append("file", file, file.name);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", UPLOAD_API);
  xhr.setRequestHeader("Accept", "application/json");
  btn.disabled = true;
  setMsg("mengupload 0%");

  xhr.upload.onprogress = e => {
    if (e.lengthComputable) setMsg("mengupload " + Math.round(e.loaded / e.total * 100) + "%");
  };
  xhr.onload = () => {
    btn.disabled = false;
    try {
      const id = JSON.parse(xhr.responseText).id;
      if (!id) throw 0;
      link = CDN(id);
      setMsg(link, true);
      v.src = link;                      // putar dari link videy
      v.play().catch(() => {});
    } catch {
      setMsg("gagal ambil link (status " + xhr.status + ")");
    }
  };
  xhr.onerror = () => {
    btn.disabled = false;
    setMsg("upload gagal (CORS / koneksi)");
  };
  xhr.send(fd);
});
</script>
</body>
</html>
