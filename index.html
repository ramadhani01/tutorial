<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Player</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0e0e12;color:#f1f1f4;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:720px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top button{flex-shrink:0;padding:13px 26px;border:0;border-radius:10px;background:#6c5ce7;color:#fff;font-family:inherit;font-size:1.15rem;font-weight:600;cursor:pointer}
.top button:disabled{opacity:.5}
.top p{margin:0;font-size:1.1rem;font-weight:500;color:#f1f1f4}
#file{display:none}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
#list video{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#000;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button id="btn" type="button">Upload</button>
    <p id="msg"></p>
    <input id="file" type="file" accept="video/*">
  </div>
  <div id="list"></div>
</div>
<script>
const UPLOAD_API = "https://videy.co/api/upload";        // FILL: kalau kena CORS, ganti ke URL worker.js-mu
const CDN        = id => "https://cdn.videy.co/" + id + ".mp4";

const list = document.getElementById("list");
const f = document.getElementById("file");
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");

function openFull(v){
  list.querySelectorAll("video").forEach(o => { if (o !== v) o.pause(); });
  const req = v.requestFullscreen || v.webkitRequestFullscreen;
  if (req) req.call(v).catch(() => {});
  else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
  v.play().catch(() => {});
}

document.addEventListener("fullscreenchange", () => {
  const cur = document.fullscreenElement;
  list.querySelectorAll("video").forEach(o => {
    o.controls = o === cur;
    if (o !== cur) o.pause();
  });
});

function addVideo(src){
  const v = document.createElement("video");
  v.playsInline = true;
  v.preload = "metadata";
  v.src = src + "#t=0.1";
  v.addEventListener("click", () => { if (!document.fullscreenElement) openFull(v); });
  list.appendChild(v);
}

btn.addEventListener("click", () => f.click());

f.addEventListener("change", () => {
  const file = f.files[0];
  f.value = "";
  if (!file) return;

  const fd = new FormData();
  fd.append("file", file, file.name);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", UPLOAD_API);
  xhr.setRequestHeader("Accept", "application/json");
  btn.disabled = true;
  msg.textContent = "mengupload 0%";

  xhr.upload.onprogress = e => {
    if (e.lengthComputable) msg.textContent = "mengupload " + Math.round(e.loaded / e.total * 100) + "%";
  };
  xhr.onload = () => {
    btn.disabled = false;
    try {
      const id = JSON.parse(xhr.responseText).id;
      if (!id) throw 0;
      msg.textContent = "";
      addVideo(CDN(id));
    } catch {
      msg.textContent = "gagal ambil link (status " + xhr.status + ")";
    }
  };
  xhr.onerror = () => {
    btn.disabled = false;
    msg.textContent = "upload gagal (CORS / koneksi)";
  };
  xhr.send(fd);
});
</script>
</body>
</html>
