<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Player</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0e0e12;color:#f1f1f4;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:720px}
video{display:block;margin:0 auto;max-width:100%;height:calc(100vh - 190px);height:calc(100dvh - 190px);aspect-ratio:9/16;object-fit:contain;border-radius:12px;background:#000}
.info{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.info p{margin:0;font-size:1.2rem;line-height:1.35;font-weight:500;color:#f1f1f4}
.info a{flex-shrink:0;padding:13px 26px;border-radius:10px;background:#6c5ce7;color:#fff;text-decoration:none;font-size:1.15rem;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <video id="v" controls playsinline></video>
  <div class="info">
    <p>pencet tombol disamping untuk salin tautan video tiktok</p>
    <a id="btn" href="#" target="_blank" rel="noopener">Buka</a>
  </div>
</div>
<script>
const VIDEO_URL  = "https://cdn.videy.co/vkNgpJHF1.mp4"; // ganti link video di sini
const TIKTOK_URL = "https://vt.tiktok.com/ZSgyMj1v2/";
document.getElementById("v").src = VIDEO_URL;
document.getElementById("btn").href = TIKTOK_URL;
</script>
</body>
</html>
